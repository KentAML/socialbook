<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SocialBook Classroom Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="register-container">
    <section class="register-box">
      <h1 class="logo">socialbook</h1>
      <h2>Create a New Account</h2>
      <p>It's quick and easy.</p>
      <hr>
      <form id="registerForm">
        <div class="name-row">
          <div><label for="firstName">First name</label><input type="text" id="firstName" placeholder="First name" required></div>
          <div><label for="lastName">Last name</label><input type="text" id="lastName" placeholder="Last name" required></div>
        </div>
        <label for="birthday">Birthday</label>
        <input type="date" id="birthday" required>
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="">Select gender</option>
          <option value="Female">Female</option>
          <option value="Male">Male</option>
          <option value="Other">Other</option>
          <option value="Prefer not to say">Prefer not to say</option>
        </select>
        <label for="registerEmail">Email address</label>
        <input type="email" id="registerEmail" placeholder="Email address" required>
        <label for="registerPassword">Password (8 or more characters)</label>
        <input type="password" id="registerPassword" placeholder="New password" minlength="8" required>
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" minlength="8" required>
        <button type="submit" class="btn-success">Create Account</button>
      </form>
      <p id="registerMessage" class="message" role="status"></p>
      <a href="index.html" class="back-link">Already have an account?</a>
    </section>
  </main>
  <footer>Use fictional details only. This demo stores passwords insecurely in your browser.</footer>
  <script src="script.js"></script>
</body>
</html>
