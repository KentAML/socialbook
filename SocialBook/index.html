<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | SocialBook Classroom Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-container">
    <section class="intro">
      <h1 class="logo">socialbook</h1>
      <h2>Connect with friends and the world around you.</h2>
      <p>Explore the things you love.</p>
    </section>
    <section class="login-box">
      <h2>Log in to SocialBook</h2>
      <form id="loginForm">
        <label for="loginEmail">Email address</label>
        <input type="email" id="loginEmail" placeholder="Email address" required>
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <p id="loginMessage" class="message" role="status"></p>
      <hr>
      <a href="register.html" class="btn-outline">Create New Account</a>

      <!-- Move accounts and photos between PCs -->
      <button type="button" id="exportBtn" class="btn-outline">Export accounts</button>
      <label for="importInput" class="btn-outline" style="cursor:pointer;">Import accounts</label>
      <input type="file" id="importInput" accept=".json" style="display:none;">
    </section>
  </main>
  <footer>Educational demonstration only — not affiliated with Meta or Facebook.</footer>
  <script type="module" src="script.js"></script>
</body>
</html>
