<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | SocialBook Classroom Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="profile-header">
    <h2>socialbook</h2>
    <button id="logoutBtn" class="btn-logout">Log Out</button>
  </header>
  <main class="profile-container">
    <section class="profile-card">
      <label for="photoInput" class="avatar" title="Click to change photo">
        <img id="profileImage" alt="Profile picture" hidden>
        <span id="profileInitial">U</span>
        <span class="avatar-overlay">Change</span>
      </label>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">
      <h1 id="profileName">User Name</h1>
      <p>Welcome to your profile!</p>
      <hr>
      <h3>Account Information</h3>
      <p><strong>Email:</strong> <span id="profileEmail"></span></p>
      <p><strong>Birthday:</strong> <span id="profileBirthday"></span></p>
      <p><strong>Gender:</strong> <span id="profileGender"></span></p>
    </section>
  </main>
  <footer>Classroom simulation — no real authentication server.</footer>
  <script type="module" src="script.js"></script>
</body>
</html>
